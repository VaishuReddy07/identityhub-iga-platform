services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identityhub
      POSTGRES_USER: identityhub
      POSTGRES_PASSWORD: identityhub_dev
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identityhub -d identityhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      KC_DB: dev-file
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/identityhub-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: IdentityHub
      LDAP_DOMAIN: identityhub.local
      LDAP_ADMIN_PASSWORD: ldap_dev
    ports: ["389:389"]
  backend:
    build:
      context: ./backend/identityhub-api
    image: identityhub-backend
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identityhub
      DB_USER: identityhub
      DB_PASSWORD: identityhub_dev
      OIDC_ISSUER: http://localhost:8080/realms/identityhub
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/identityhub/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
  console:
    build:
      context: ./frontend/identityhub-console
    image: identityhub-console
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak

  mailpit:
    image: axllent/mailpit:latest
    container_name: identityhub-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
